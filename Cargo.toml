[workspace]
resolver = "2"
members = ["radius-core", "radius-fixture", "radiusd"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
ring = "=0.17.14"
md-5 = "0.10.6"
hmac = "0.12.1"
zeroize = "1.9"
subtle = "2.6.1"

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 2
incremental = false
