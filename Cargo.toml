[workspace]
resolver = "2"
members = ["radius-core", "radius-fixture", "radiusd", "radius-management", "radius", "radius-accounting", "radius-policy"]
exclude = ["vendor/kernel/peios/rust/pnp-core", "vendor/kernel/peios/rust/peios-uapi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
ring = "=0.17.14"
md-5 = "0.10.6"
hmac = "0.12.1"
zeroize = "1.9"
subtle = "2.6.1"

[profile.dev]
debug = 0
incremental = false

[replace]
# RADIUS needs the read-snapshot bindings at b1290db. The SD editor uses its
# ancestor 7c05d93; keep one peios-sys link identity throughout this program.
"https://github.com/peios/peios-rs.git#peios:0.4.0" = { git = "https://github.com/peios/peios-rs.git", rev = "b1290dbfa805d4ef151d3fc961a8d89d6c30c12c" }

[profile.release]
debug = 2
incremental = false
