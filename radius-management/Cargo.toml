[package]
name = "radius-management"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
native = ["dep:peios", "dep:libc", "dep:peinit2", "dep:x509-parser", "dep:socket2", "dep:eventd-client"]

[dependencies]
radius-authorization = { path = "../radius-authorization" }
radius-core = { path = "../radius-core" }
radius-policy = { path = "../radius-policy" }
radius-accounting = { path = "../radius-accounting" }
ring.workspace = true
rustls.workspace = true
zeroize.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
peios = { git = "https://github.com/peios/peios-rs.git", rev = "623520bc0405fdd4526bab45f45882e7f19b1ab1", optional = true }
peinit2 = { git = "https://github.com/peios/peinit.git", rev = "8ff7155b87e1f8c03ce78baf64d8d7b5425fbe3a", default-features = false, optional = true }
libc = { version = "0.2", optional = true }
socket2 = { version = "0.6", features = ["all"], optional = true }
x509-parser = { version = "=0.18.1", optional = true }
eventd-client = { git = "https://github.com/peios/eventd.git", rev = "f74954f969626352915b3885848b6e21d3492c3f", default-features = false, optional = true }

[[example]]
name = "native-authority"
required-features = ["native"]

[[example]]
name = "native-accounting"
required-features = ["native"]

[[example]]
name = "native-diagnostics"
required-features = ["native"]

[[example]]
name = "migrate-policy-v3"
required-features = ["native"]

[dev-dependencies]
md-5.workspace = true
