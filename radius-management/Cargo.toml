[package]
name = "radius-management"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
native = ["dep:peios", "dep:libc", "dep:peinit2", "dep:x509-parser", "dep:socket2", "dep:eventd-client"]

[dependencies]
radius-authorization = { path = "../radius-authorization" }
radius-core = { path = "../radius-core" }
radius-policy = { path = "../radius-policy" }
radius-accounting = { path = "../radius-accounting" }
ring.workspace = true
rustls.workspace = true
zeroize.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
peios = { git = "https://github.com/peios/peios-rs.git", rev = "ebb1e39ca99ae8371dd9e8dc45844feb474d056c", optional = true }
peinit2 = { git = "https://github.com/peios/peinit.git", rev = "f03f61759a2cd7941e84452984ba0e1b613d1559", default-features = false, optional = true }
libc = { version = "0.2", optional = true }
socket2 = { version = "0.6", features = ["all"], optional = true }
x509-parser = { version = "=0.18.1", optional = true }
eventd-client = { git = "https://github.com/peios/eventd.git", rev = "ee5117a7efd8099691a933dc1b5f6428ea108473", default-features = false, optional = true }

[[example]]
name = "native-authority"
required-features = ["native"]

[[example]]
name = "native-accounting"
required-features = ["native"]

[[example]]
name = "native-diagnostics"
required-features = ["native"]

[[example]]
name = "migrate-policy-v3"
required-features = ["native"]

[dev-dependencies]
md-5.workspace = true
