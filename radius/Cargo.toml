[package]
name = "radius"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
native = ["radius-management/native", "dep:peios", "dep:libc"]
window = ["native", "dep:gxwi", "dep:gxwi-sd-editor"]

[dependencies]
radius-authorization = { path = "../radius-authorization" }
radius-management = { path = "../radius-management" }
radius-accounting = { path = "../radius-accounting" }
radius-policy = { path = "../radius-policy" }
serde_json = "1"
zeroize.workspace = true
peios = { git = "https://github.com/peios/peios-rs.git", rev = "b1290dbfa805d4ef151d3fc961a8d89d6c30c12c", optional = true }
libc = { version = "0.2", optional = true }
gxwi = { git = "https://github.com/peios/gxwi.git", rev = "3178855691c3a93fe6ee6fc7e0d8a30a07964db9", optional = true }
gxwi-sd-editor = { git = "https://github.com/peios/gxwi-essentials.git", rev = "898ecfe2f80372113e1799b2e0a6beddd00e4c6e", default-features = false, features = ["registry", "splice"], optional = true }
