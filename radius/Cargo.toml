[package]
name = "radius"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
native = ["radius-management/native", "dep:peios", "dep:libc"]
window = ["native", "dep:gxwi", "dep:gxwi-sd-editor"]

[dependencies]
radius-authorization = { path = "../radius-authorization" }
radius-management = { path = "../radius-management" }
radius-accounting = { path = "../radius-accounting" }
radius-policy = { path = "../radius-policy" }
serde_json = "1"
zeroize.workspace = true
peios = { git = "https://github.com/peios/peios-rs.git", rev = "ebb1e39ca99ae8371dd9e8dc45844feb474d056c", optional = true }
libc = { version = "0.2", optional = true }
gxwi = { git = "https://github.com/peios/gxwi.git", rev = "a8a92eb6f9127319310b3f8ad2c31f436a1f9281", optional = true }
gxwi-sd-editor = { git = "https://github.com/peios/gxwi-essentials.git", rev = "7b641ee2601a34920b5d8f468bc3597efc9b17c1", default-features = false, features = ["registry", "splice"], optional = true }
