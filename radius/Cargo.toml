[package]
name = "radius"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
native = ["radius-management/native", "dep:peios", "dep:libc"]
window = ["native", "dep:gxwi", "dep:gxwi-sd-editor"]

[dependencies]
radius-authorization = { path = "../radius-authorization" }
radius-management = { path = "../radius-management" }
radius-accounting = { path = "../radius-accounting" }
radius-policy = { path = "../radius-policy" }
serde_json = "1"
zeroize.workspace = true
peios = { git = "https://github.com/peios/peios-rs.git", rev = "623520bc0405fdd4526bab45f45882e7f19b1ab1", optional = true }
libc = { version = "0.2", optional = true }
gxwi = { git = "https://github.com/peios/gxwi.git", rev = "0cdbd97c86ca0e78138c6b320d88d5be8e2a6407", optional = true }
gxwi-sd-editor = { git = "https://github.com/peios/gxwi-essentials.git", rev = "bde15e2817e2e096c4f3ba1c6f7ef37ea1a997e4", default-features = false, features = ["registry", "splice"], optional = true }
