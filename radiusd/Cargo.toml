[package]
name = "radiusd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
native = ["dep:peios", "dep:peios-auth", "dep:libc", "dep:socket2", "radius-management/native"]

[dependencies]
radius-authorization = { path = "../radius-authorization" }
radius-core = { path = "../radius-core" }
radius-policy = { path = "../radius-policy" }
radius-management = { path = "../radius-management" }
radius-accounting = { path = "../radius-accounting" }
ring.workspace = true
rustls.workspace = true
zeroize.workspace = true
serde_json = "1"
libc = { version = "0.2", optional = true }
socket2 = { version = "0.6", optional = true }
peios = { git = "https://github.com/peios/peios-rs.git", rev = "623520bc0405fdd4526bab45f45882e7f19b1ab1", optional = true }
peios-auth = { git = "https://github.com/peios/authd.git", rev = "327ce68648e1594331c88a457afb261f9000b4c3", optional = true }

[dev-dependencies]
serde_json = "1"
rcgen = { version = "=0.14.9", default-features = false, features = ["ring", "crypto"] }
hmac.workspace = true
md-5.workspace = true

[[bin]]
name = "radiusd"
path = "src/main.rs"
required-features = ["native"]

[[example]]
name = "native-events"
path = "examples/native-events.rs"
required-features = ["native"]

[[example]]
name = "native-session-controls"
required-features = ["native"]
