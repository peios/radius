[package]
name = "radiusd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
native = ["dep:peios", "dep:peios-auth", "dep:libc", "dep:socket2"]

[dependencies]
radius-core = { path = "../radius-core" }
ring.workspace = true
rustls.workspace = true
zeroize.workspace = true
libc = { version = "0.2", optional = true }
socket2 = { version = "0.6", optional = true }
peios = { git = "https://github.com/peios/peios-rs.git", rev = "3950d35950c46cb3538885b7cf05bde059393def", optional = true }
peios-auth = { git = "https://github.com/peios/authd.git", rev = "ea3c9f90c48052ff0c0757d88032c9c706964b9a", optional = true }

[dev-dependencies]
rcgen = { version = "=0.14.9", default-features = false, features = ["ring", "crypto"] }
hmac.workspace = true
md-5.workspace = true

[[bin]]
name = "radiusd"
path = "src/main.rs"
required-features = ["native"]

[[example]]
name = "native-events"
path = "examples/native-events.rs"
required-features = ["native"]
