[package]
name = "radiusd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
native = ["dep:peios", "dep:peios-auth", "dep:libc", "dep:socket2", "radius-management/native"]

[dependencies]
radius-core = { path = "../radius-core" }
radius-management = { path = "../radius-management" }
ring.workspace = true
rustls.workspace = true
zeroize.workspace = true
libc = { version = "0.2", optional = true }
socket2 = { version = "0.6", optional = true }
peios = { git = "https://github.com/peios/peios-rs.git", rev = "b1290dbfa805d4ef151d3fc961a8d89d6c30c12c", optional = true }
peios-auth = { git = "https://github.com/peios/authd.git", rev = "5f4fbcd66c9aaaf2bd1b5b0fb5e58069af0be652", optional = true }

[dev-dependencies]
rcgen = { version = "=0.14.9", default-features = false, features = ["ring", "crypto"] }
hmac.workspace = true
md-5.workspace = true

[[bin]]
name = "radiusd"
path = "src/main.rs"
required-features = ["native"]

[[example]]
name = "native-events"
path = "examples/native-events.rs"
required-features = ["native"]
