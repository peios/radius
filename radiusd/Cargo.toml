[package]
name = "radiusd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
native = ["dep:peios", "dep:peios-auth", "dep:libc", "dep:socket2", "radius-management/native"]

[dependencies]
radius-authorization = { path = "../radius-authorization" }
radius-core = { path = "../radius-core" }
radius-policy = { path = "../radius-policy" }
radius-management = { path = "../radius-management" }
radius-accounting = { path = "../radius-accounting" }
ring.workspace = true
rustls.workspace = true
zeroize.workspace = true
serde_json = "1"
libc = { version = "0.2", optional = true }
socket2 = { version = "0.6", optional = true }
peios = { git = "https://github.com/peios/peios-rs.git", rev = "ebb1e39ca99ae8371dd9e8dc45844feb474d056c", optional = true }
peios-auth = { git = "https://github.com/peios/authd.git", rev = "af3f0df00b94bf578b27788fc2682d795fe46505", optional = true }

[dev-dependencies]
serde_json = "1"
rcgen = { version = "=0.14.9", default-features = false, features = ["ring", "crypto"] }
hmac.workspace = true
md-5.workspace = true

[[bin]]
name = "radiusd"
path = "src/main.rs"
required-features = ["native"]

[[example]]
name = "native-events"
path = "examples/native-events.rs"
required-features = ["native"]

[[example]]
name = "native-session-controls"
required-features = ["native"]
